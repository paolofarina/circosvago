{{- $c := site.Params.contatti }}
{{- if or $c.instagram $c.facebook }}
<ul class="social">
  {{- with $c.instagram }}
  <li><a href="{{ . }}" rel="noopener" aria-label="Circo Svago su Instagram">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.3" fill="currentColor"/></svg>
  </a></li>
  {{- end }}
  {{- with $c.facebook }}
  <li><a href="{{ . }}" rel="noopener" aria-label="Circo Svago su Facebook">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v2H7v4h3v7h4v-7h3l1-4h-4V8z" fill="currentColor"/></svg>
  </a></li>
  {{- end }}
</ul>
{{- end }}
