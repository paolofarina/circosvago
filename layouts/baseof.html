<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
  {{ partial "head.html" . }}
</head>
{{- $colore := partial "colore.html" . }}
<body data-colore="{{ $colore }}">
  <a class="salta" href="#contenuto">Vai al contenuto</a>
  {{ partial "header.html" . }}
  <main id="contenuto">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "lightbox.html" . }}
  {{ partialCached "head/js.html" . }}
</body>
</html>
