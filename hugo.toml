[imaging]
  resampleFilter = 'Lanczos'
  [imaging.jpeg]
    quality = 80
  [imaging.webp]
    quality = 78
  [imaging.exif]
    disableDate = true
    disableLatLong = true

[markup.goldmark.renderer]
  unsafe = false

[sitemap]
  changeFreq = 'monthly'

[module.hugoVersion]
  extended = true
  min = '0.146.0'

# Pubblica solo le immagini che le pagine usano davvero (le versioni ridimensionate),
# non gli originali dei page bundle: ~23 MB in meno nella build.
[[cascade]]
  [cascade.build]
    publishResources = false
