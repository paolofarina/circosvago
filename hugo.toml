baseURL = 'https://www.circosvago.it/'
locale = 'it-IT'
title = 'Circo Svago — Scuola di circo'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[params]
  description = "Circo Svago è una scuola di circo educativo e sociale ad Albano Laziale, nei Castelli Romani: corsi, spettacoli, centri estivi e progetti per tutte le età."
  motto = "Be a rebel. Join the circus."
  # Carattere dei titoli grandi: "pennarello" (Shantell Sans) oppure "corsivo" (Style Script, vicino alla brochure)
  titoli = "pennarello"
  fondazione = 2015

  [params.contatti]
    indirizzo = "Piazza A. Moro, 45"
    cap_citta = "00041 Albano Laziale (RM)"
    telefono = "+39 331 868 1147"
    telefono_nome = "Jacopo"
    email_info = "info@circosvago.it"
    email_segreteria = "segreteria@circosvago.it"
    email_eventi = "eventi@circosvago.it"
    # Link ai profili social: da completare (vuoto = il link non viene mostrato)
    instagram = "https://www.instagram.com/circosvago/"
    facebook = "https://www.facebook.com/profile.php?id=100063646507444"

  # Modulo contatti: un sito statico ha bisogno di un servizio esterno (Netlify Forms, Formspree...).
  # Finché "azione" è vuota, al posto del modulo si mostrano i link email.
  [params.modulo]
    azione = ""

